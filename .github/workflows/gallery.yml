name: Publish Gallery

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel an older Pages deployment when a newer one starts.
concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Gallery

    # Exclude the template/source repository.
    # Only check head_commit.message for push events.
    if: >-
      github.repository != 'gautamkrishnar/github-pages-gallery' &&
      (
        github.event_name == 'pull_request' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          github.event.head_commit.message != '' &&
          github.event.head_commit.message != 'Initial commit'
        )
      )

    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Gallery 🔧
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            ghcr.io/thumbsup/thumbsup \
            /bin/sh -c "cd /work && thumbsup --config config.json"

      - name: Package and upload Pages artifact 📦
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build_output
          name: gh-pages

  deploy:
    name: Publish Gallery to GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: gh-pages